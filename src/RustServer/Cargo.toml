[package]
name = "zilean_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
parsett_rust = { path = "../ParsettOverToRust" }
reqwest = { version = "0.12.18", features = ["stream", "gzip"] }
flate2 = "1.1.1"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "fs", "signal", "sync"] }
tantivy = "0.24.1"
tokio-stream = "0.1.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
chrono = {version = "0.4.41", features = ["serde"]}
anyhow = "1.0.98"
sqlx = {version = "0.8.6", features = ["postgres", "runtime-tokio", "macros", "tls-rustls", "migrate", "chrono", "json"]}
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
config = { version = "0.15.11", features = ["serde_json"] }
rayon = "1.10.0"
jemallocator = "0.5.4"
git2 = "0.20.2"
regex = "1.11.1"
lazy_static = "1.5.0"
dashmap = "6.1.0"
time = "0.3.41"
lz-str = "0.2.1"
async-trait = "0.1.88"
async-stream = "0.3.6"
futures-core = "0.3.31"
futures = "0.3.31"
strsim = "0.11.1"
arc-swap = "1.7.1"
# HTTP surface (axum + middleware stack).
axum = { version = "0.8.1", features = ["json", "query", "macros", "tokio"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace", "timeout", "cors"] }
# XML for Torznab (capabilities + RSS result page + error body).
quick-xml = "0.37.2"
# Content hashing for the Torznab GUID (SHA-256 of the infohash).
sha2 = "0.10.8"
# Percent-encoded query parsing for some Torznab quirks.
urlencoding = "2.1.3"
# Explicit bytes dep used by the streaming /torrents/all handler.
bytes = "1.9.0"
# Command-line interface, job scheduler, and optional in-cluster
# Kubernetes service discovery.
clap = { version = "4.5.23", features = ["derive", "env"] }
tokio-cron-scheduler = "0.13.0"
kube = { version = "0.97.0", default-features = false, features = ["client", "rustls-tls"], optional = true }
k8s-openapi = { version = "0.23.0", features = ["v1_31"], optional = true }

[features]
debug = []
kubernetes = ["dep:kube", "dep:k8s-openapi"]
