version: "3"

tasks:
  default:
    silent: true
    cmds: ["task -l"]

  build:
    desc: "Build the Rust binary in release mode."
    cmds:
      - cargo build --release -p zilean_rust

  test:
    desc: "Run the workspace tests."
    cmds:
      - cargo test --workspace

  docker:
    desc: "Build the container image locally."
    cmds:
      - docker build -t zilean:dev -f Dockerfile .
