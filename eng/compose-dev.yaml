### Docker Compose file for development. Do not use in production without
### changing the Postgres credentials and updating the connection string,
### and do not expose the Postgres port publicly.

services:
  postgres:
    image: postgres:17.2
    container_name: postgres
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zilean
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  zilean:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: zilean
    tty: true
    environment:
      # Flat env vars consumed by the Rust binary. See
      # src/RustServer/src/configuration/config.rs for the full list.
      ZILEAN_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/zilean"
      ZILEAN_PARSING_THREADS: 6
      ZILEAN_HTTP_PORT: 8181
      ZILEAN_HTTP_BIND: "0.0.0.0"
      # Generate one with `openssl rand -hex 32` for non-dev deployments.
      ZILEAN_API_KEY: "dev-api-key-change-me"
    restart: no
    volumes:
      - zilean_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - 8181:8181

volumes:
  zilean_data:
  postgres_data:
